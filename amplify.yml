version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm install --global pnpm@12.8.1
        - pnpm install --frozen-lockfile --store-dir .pnpm-store
    build:
      commands:
        - pnpm build
        - cp -R node_modules .amplify-hosting/compute/default/node_modules
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
