# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# The about page, one editable section per collection. The leadership cards are
# not listed here — they come from Site: Leadership.
singletons:
  - name: about-seo
    label: "About: Search & Social"
    file: src/content/about/seo.json
    icon: search
    fields:
      - label: Meta Title
        name: meta_title
        widget: string
      - label: Meta Description
        name: meta_description
        widget: text

  - name: about-hero
    label: "About: Hero"
    file: src/content/about/hero.json
    icon: featured_video
    fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
      - label: Page Title
        name: title
        widget: string
      - label: Intro
        name: intro
        widget: text

  - name: about-cpe
    label: "About: About CPE"
    file: src/content/about/about-cpe.json
    icon: info
    hint: Linked from the header menu as /about#about-cpe.
    fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
      - label: Title
        name: title
        widget: string
      - label: Paragraphs
        name: paragraphs
        widget: list
        label_singular: Paragraph
        field:
          label: Paragraph
          name: paragraph
          widget: text
      - label: Image
        name: image
        widget: image
        required: false
        hint: A placeholder box with the alt text shows until this is set.
      - label: Image Alt Text
        name: image_alt
        widget: string

  - name: about-history
    label: "About: Our History"
    file: src/content/about/history.json
    icon: history
    fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
      - label: Title
        name: title
        widget: string
      - label: Milestones
        name: items
        widget: list
        label_singular: Milestone
        summary: "{{fields.title}}"
        fields:
          - label: Icon
            name: icon
            widget: select
            options:
              - lucide:history
              - lucide:compass
              - lucide:flag
              - lucide:award
              - lucide:building-2
              - lucide:graduation-cap
              - lucide:users
          - label: Title
            name: title
            widget: string
          - label: Description
            name: description
            widget: text

  - name: about-vision-mission
    label: "About: Vision and Mission"
    file: src/content/about/vision-mission.json
    icon: visibility
    hint: Linked from the header menu as /about#vision-mission.
    fields:
      - label: Vision
        name: vision
        widget: object
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Statement
            name: title
            widget: text
          - label: Description
            name: description
            widget: text
      - label: Mission
        name: mission
        widget: object
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Commitments
            name: items
            widget: list
            label_singular: Commitment
            field:
              label: Commitment
              name: item
              widget: text

  - name: about-why-choose
    label: "About: Why Choose CPE"
    file: src/content/about/why-choose.json
    icon: star
    fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
      - label: Title
        name: title
        widget: string
      - label: Reasons
        name: items
        widget: list
        label_singular: Reason
        field:
          label: Reason
          name: item
          widget: text

  - name: about-leadership
    label: "About: Leadership"
    file: src/content/about/leadership.json
    icon: groups
    hint: >-
      Linked from the header menu as /about#leadership. The people themselves
      are managed under Site: Leadership.
    fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
