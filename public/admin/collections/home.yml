# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Every piece of copy on the home page. The course cards are not listed here —
# they are generated from the Courses collection.
singletons:
  - name: home
    label: Home page
    file: src/content/home.json
    icon: home
    fields:
      - label: Meta Title
        name: meta_title
        widget: string

      - label: Meta Description
        name: meta_description
        widget: text

      - label: Hero
        name: hero
        widget: object
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Title
            name: title
            widget: string
          - label: Intro
            name: intro
            widget: text
          - label: Primary Button
            name: primary_cta
            widget: object
            fields:
              - label: Label
                name: label
                widget: string
              - label: Link
                name: href
                widget: string
          - label: Secondary Button
            name: secondary_cta
            widget: object
            fields:
              - label: Label
                name: label
                widget: string
              - label: Link
                name: href
                widget: string
          - label: Stats
            name: stats
            widget: list
            label_singular: Stat
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - label: Label
                name: label
                widget: string
              - label: Value
                name: value
                widget: string
          - label: Image
            name: image
            widget: image
            required: false
            hint: A placeholder box with the alt text shows until this is set.
          - label: Image Alt Text
            name: image_alt
            widget: string
          - label: Image Badge
            name: badge
            widget: string
            required: false
            hint: Small accent caption over the bottom of the hero image.

      - label: About Section
        name: about
        widget: object
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Title
            name: title
            widget: string
          - label: Paragraphs
            name: paragraphs
            widget: list
            label_singular: Paragraph
            field:
              label: Paragraph
              name: paragraph
              widget: text
          - label: Button
            name: cta
            widget: object
            fields:
              - label: Label
                name: label
                widget: string
              - label: Link
                name: href
                widget: string
          - label: Image
            name: image
            widget: image
            required: false
          - label: Image Alt Text
            name: image_alt
            widget: string

      - label: Courses Section
        name: courses
        widget: object
        hint: The cards come from the Courses collection automatically.
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Title
            name: title
            widget: string
          - label: Description
            name: description
            widget: text
          - label: Button
            name: cta
            widget: object
            fields:
              - label: Label
                name: label
                widget: string
              - label: Link
                name: href
                widget: string

      - label: Why Choose CPE
        name: why_choose
        widget: object
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Title
            name: title
            widget: string
          - label: Points
            name: items
            widget: list
            label_singular: Point
            summary: "{{fields.title}}"
            fields:
              - label: Icon
                name: icon
                widget: select
                options:
                  - lucide:book-open-check
                  - lucide:target
                  - lucide:users
                  - lucide:shield-check
                  - lucide:graduation-cap
                  - lucide:award
                  - lucide:clock
                  - lucide:building-2
              - label: Title
                name: title
                widget: string
              - label: Description
                name: description
                widget: text

      - label: Career-Focused Learning
        name: career_focus
        widget: object
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Title
            name: title
            widget: string
          - label: Description
            name: description
            widget: text
          - label: Destinations
            name: items
            widget: list
            label_singular: Destination
            summary: "{{fields.title}}"
            fields:
              - label: Title
                name: title
                widget: string
              - label: Description
                name: description
                widget: text

      - label: Leadership
        name: leadership
        widget: object
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Title
            name: title
            widget: string
          - label: Button
            name: cta
            widget: object
            fields:
              - label: Label
                name: label
                widget: string
              - label: Link
                name: href
                widget: string
          - label: People
            name: people
            widget: list
            label_singular: Person
            summary: "{{fields.name}}"
            fields:
              - label: Name
                name: name
                widget: string
              - label: Role
                name: role
                widget: string
              - label: Biography
                name: bio
                widget: text
              - label: Photograph
                name: photo
                widget: image
                required: false
                hint: The first letter of the name shows until a photo is added.

      - label: Campus and Student Life
        name: campus_life
        widget: object
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Title
            name: title
            widget: string
          - label: Description
            name: description
            widget: text
          - label: Primary Button
            name: primary_cta
            widget: object
            fields:
              - label: Label
                name: label
                widget: string
              - label: Link
                name: href
                widget: string
          - label: Secondary Button
            name: secondary_cta
            widget: object
            fields:
              - label: Label
                name: label
                widget: string
              - label: Link
                name: href
                widget: string
          - label: Image
            name: image
            widget: image
            required: false
          - label: Image Alt Text
            name: image_alt
            widget: string

      - label: Achievements
        name: achievements
        widget: object
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Title
            name: title
            widget: string
          - label: Description
            name: description
            widget: text
            required: false
          - label: Button
            name: cta
            widget: object
            fields:
              - label: Label
                name: label
                widget: string
              - label: Link
                name: href
                widget: string
          - label: Placeholder Message
            name: empty_message
            widget: text
            hint: Shown until achievements are published.

      - label: Admissions Banner
        name: cta_banner
        widget: object
        fields:
          - label: Kicker
            name: kicker
            widget: string
          - label: Title
            name: title
            widget: string
          - label: Description
            name: description
            widget: text
          - label: Phone Numbers
            name: phones
            widget: relation
            required: false
            multiple: true
            collection: _singletons
            file: contact-details
            value_field: phone_numbers.*
            display_fields:
              - phone_numbers.*
            search_fields:
              - phone_numbers.*
            hint: Leave empty to show every number from Contact details.
          - label: Button
            name: cta
            widget: object
            fields:
              - label: Label
                name: label
                widget: string
              - label: Link
                name: href
                widget: string

      - label: News and Events
        name: news
        widget: object
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Title
            name: title
            widget: string
          - label: Description
            name: description
            widget: text
            required: false
          - label: Button
            name: cta
            widget: object
            fields:
              - label: Label
                name: label
                widget: string
              - label: Link
                name: href
                widget: string
          - label: Placeholder Message
            name: empty_message
            widget: text
            hint: Shown until news items are published.
