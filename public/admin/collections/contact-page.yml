# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# The contact page. The address, phone, email and social cards are rendered
# from Site: Contact details, and the message form is fixed in code, so only
# the page headings are editable here.
singletons:
  - name: contact-seo
    label: "Contact: Search & Social"
    file: src/content/contact/seo.json
    icon: search
    fields:
      - label: Meta Title
        name: meta_title
        widget: string
      - label: Meta Description
        name: meta_description
        widget: text

  - name: contact-hero
    label: "Contact: Hero"
    file: src/content/contact/hero.json
    icon: featured_video
    fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
      - label: Page Title
        name: title
        widget: string
      - label: Intro
        name: intro
        widget: text

  - name: contact-location
    label: "Contact: Location"
    file: src/content/contact/location.json
    icon: location_on
    hint: >-
      The map points at the address in Site: Contact details, or at the Map URL
      set there if one is given.
    fields:
      - label: Eyebrow
        name: eyebrow
        widget: string
      - label: Title
        name: title
        widget: string
      - label: Map Description
        name: map_title
        widget: string
        hint: Read aloud by screen readers in place of the map.
