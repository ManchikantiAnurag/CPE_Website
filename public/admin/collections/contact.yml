# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Contact page headings and form copy. Contact information is managed
# separately under Contact details.

collections:
  - name: contact
    label: Contact page
    icon: contact_mail
    files:
      - name: seo
        label: "Search & Social"
        file: src/content/contact/seo.json
        icon: search
        fields:
          - label: Meta Title
            name: meta_title
            widget: string
          - label: Meta Description
            name: meta_description
            widget: text

      - name: hero
        label: "Hero"
        file: src/content/contact/hero.json
        icon: featured_video
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Page Title
            name: title
            widget: string
          - label: Intro
            name: intro
            widget: text

      - name: location
        label: "Location"
        file: src/content/contact/location.json
        icon: location_on
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: string
          - label: Title
            name: title
            widget: string
            hint: >-
              The map points at the address in Contact details, or at the Map
              URL set there if one is given.
          - label: Map Description
            name: map_title
            widget: string
            hint: Read aloud by screen readers in place of the map.

      - name: form
        label: Message Form
        file: src/content/contact/form.json
        fields:
          - label: Heading
            name: title
            widget: string
          - label: Description
            name: description
            widget: text
          - label: Submit Button
            name: submit_label
            widget: string
          - label: Success Message
            name: success_message
            widget: text
          - label: Field Labels
            name: labels
            widget: object
            fields:
              - label: Name
                name: name
                widget: string
              - label: Mobile Number
                name: mobile
                widget: string
              - label: Email
                name: email
                widget: string
              - label: Subject
                name: subject
                widget: string
              - label: Message
                name: message
                widget: string
